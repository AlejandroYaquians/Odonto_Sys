<div class="table-responsive">
  <table class="table table-sm align-middle mb-2">
    <thead>
      <tr>
        <th scope="col" class="fw-medium">Servicio</th>
        <th scope="col" class="servicio-precio fw-medium">Precio</th>
        <th scope="col" class="servicio-quitar"></th>
      </tr>
    </thead>
    <tbody>
      @for (linea of lineas; track $index) {
        <tr>
          <td>
            <select
              class="form-select"
              [class.is-invalid]="mostrarErrores && linea.idServicio === null"
              (change)="cambiarServicio($index, $any($event.target).value)"
            >
              <option value="" [selected]="linea.idServicio === null">Seleccione...</option>
              @for (servicio of servicios; track servicio.idServicio) {
                <option [value]="servicio.idServicio" [selected]="linea.idServicio === servicio.idServicio">
                  {{ servicio.nombre }}
                </option>
              }
            </select>
          </td>
          <td>
            <input
              type="number"
              step="0.01"
              min="0"
              class="form-control"
              [class.is-invalid]="precioInvalido(linea)"
              [value]="linea.precio"
              (input)="cambiarPrecio($index, $any($event.target).value)"
            />
          </td>
          <td class="text-end">
            <button
              type="button"
              class="btn btn-outline-danger btn-sm"
              title="Quitar servicio"
              [disabled]="lineas.length === 1"
              (click)="quitar($index)"
            >
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      }
    </tbody>
    <tfoot>
      <tr>
        <th scope="row" class="fw-medium">Total de servicios</th>
        <th class="fw-medium">Q{{ total | number: '1.2-2' }}</th>
        <th></th>
      </tr>
    </tfoot>
  </table>
</div>
<button type="button" class="btn btn-outline-primary btn-sm" (click)="agregar()">
  <i class="bi bi-plus-lg"></i>
  Agregar servicio
</button>
